name: Generate metrics

# Requires a repository secret `METRICS_TOKEN`:
#   a classic Personal Access Token with `public_repo` + `read:user` scopes.
#   The default GITHUB_TOKEN cannot read user-level data, so it won't work here.

on:
  schedule:
    - cron: "30 18 * * *" # 03:30 JST daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: okmtdev
          filename: github-metrics.svg
          output_action: commit
          committer_message: "chore: update github-metrics.svg [skip ci]"

          template: classic
          base: header, activity, community, repositories
          base_indepth: yes
          config_timezone: Asia/Tokyo
          config_display: large

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_ignored: html, css, dockerfile
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year


          plugin_lines: yes
          plugin_lines_sections: base, repositories

          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
